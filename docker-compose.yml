services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 4000
      NODE_ENV: production
      CLIENT_ORIGIN: http://localhost:5173
      PRODUCTS_API_BASE_URL: https://fakestoreapi.com
      SALES_INBOX: sales@example.com
      EMAIL_FROM: catalogue@example.com
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
    ports:
      - "4000:4000"
    depends_on:
      - mailpit

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
    ports:
      - "5173:80"
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
